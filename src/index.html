<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>pod</title>

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Set up -->
    <link rel="stylesheet" href="styles/root.css" />
    <link rel="stylesheet" href="styles/camera.css" />
    <link rel="stylesheet" href="styles/ui.css" />

    <!-- Primitaves-->
    <link rel="stylesheet" href="styles/box.css" />
    <link rel="stylesheet" href="styles/tri.css" />
    <link rel="stylesheet" href="styles/plane.css" />
    <link rel="stylesheet" href="styles/room.css" />

    <!-- Objects -->
    <link rel="stylesheet" href="styles/door.css" />

    <!-- Misc Styles -->
    <link rel="stylesheet" href="styles/styles.css" />
  </head>

  <body>
    <div id="game">
      <%- include("templates/bunk") %>
      <%- include("templates/cockpit") %>
      <%- include("templates/reactor") %>
    </div>

    <div id="gizmo">
      <div class="bow">
        <input type="radio" name="view" id="view-bow" />
        <label for="view-bow">Bow</label>
      </div>

      <div class="port">
        <input type="radio" name="view" id="view-port" />
        <label for="view-port">Port</label>
      </div>

      <div class="stern">
        <input type="radio" name="view" id="view-stern" checked />
        <label for="view-stern">Stern</label>
      </div>

      <div class="starboard">
        <input type="radio" name="view" id="view-starboard" />
        <label for="view-starboard">Starboard</label>
      </div>
    </div>
  </body>
</html>
